<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-light shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">Massimo Saracino</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Apri menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto text-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="cv.html">CV</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contattami</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero text-center">
    <div class="container">
      <h1>Contattami</h1>
      <p class="lead">Hai un progetto in mente o vuoi semplicemente scambiare due chiacchiere? Scrivimi.</p>
    </div>
  </header>

  <main class="container my-5">
    <!--
      Nota per uso futuro: per inviare davvero questi dati via email senza un backend,
      si può integrare EmailJS (https://www.emailjs.com/).
      Basta aggiungere lo script EmailJS, il proprio Service ID / Template ID / Public Key,
      e nel tag <form> gestire l'evento "submit" con emailjs.sendForm(...).
      Di default il form qui sotto non invia dati, per evitare dipendenze esterne.
    -->
    <form class="contact-form" onsubmit="return false;">

      <div class="mb-3">
        <label for="name" class="form-label">Nome</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <div class="mb-3">
        <label for="subject" class="form-label">Oggetto</label>
        <input type="text" class="form-control" id="subject" name="subject">
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Messaggio</label>
        <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn btn-cta btn-primary">Invia messaggio</button>
    </form>
  </main>

  <footer class="site-footer">
    <p class="mb-0">&copy; 2026 Massimo Saracino. Sito realizzato con HTML, CSS, Sass e Bootstrap.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
